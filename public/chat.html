<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguru AI Mentorship</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #FAFAFA; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #6200EE; color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; }
        .banner { background-color: #FF9800; color: white; text-align: center; padding: 10px; font-size: 14px; display: none; font-weight: bold; }
        
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 15px; border-radius: 15px; font-size: 16px; line-height: 1.4; }
        .user-message { background-color: #E0E0E0; color: #333; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background-color: #FFFFFF; color: #333; border: 1px solid #DDD; align-self: flex-start; border-bottom-left-radius: 2px; }
        .ai-testing { border: 2px solid #D32F2F; border-top: 20px solid #D32F2F; position: relative; }
        
        .input-area { padding: 15px; background-color: #FFF; border-top: 1px solid #DDD; display: flex; align-items: center; gap: 10px; }
        input[type="text"] { flex: 1; padding: 15px; border: 1px solid #DDD; border-radius: 25px; font-size: 16px; }
        
        .btn-send { background-color: #6200EE; color: white; border: none; padding: 15px 20px; border-radius: 25px; font-weight: bold; }
        .btn-mic { background-color: #FF3B30; color: white; border: none; padding: 15px; border-radius: 50%; font-size: 20px; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .listening { animation: pulse 1.5s infinite; background-color: #D32F2F; transform: scale(1.1); }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(211, 47, 47, 0); }
            100% { box-shadow: 0 0 0 0 rgba(211, 47, 47, 0); }
        }
    </style>
</head>
<body>

    <div class="header">Nguru Mentorship</div>
    <div id="deferredBanner" class="banner"></div>

    <div class="chat-container" id="chatBox">
        <div class="message ai-message">Welcome to Nguru. Tap the microphone to speak, or type a message.</div>
    </div>

    <div class="input-area">
        <button id="micBtn" class="btn-mic" onclick="toggleVoice()">🎤</button>
        <input type="text" id="userInput" placeholder="Ask Nguru...">
        <button class="btn-send" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const userId = localStorage.getItem("nguru_userId");
        if (!userId) window.location.href = "/index.html";

        // 1. Android Audio Unlocker (Crucial for Mobile)
        let isAudioUnlocked = false;
        function unlockAudio() {
            if (!isAudioUnlocked) {
                const silentUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(silentUtterance);
                isAudioUnlocked = true;
            }
        }

        // 2. Microphone Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isListening = false;
        const micBtn = document.getElementById("micBtn");
        const inputField = document.getElementById("userInput");

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = function() {
                isListening = true;
                micBtn.classList.add("listening");
                inputField.placeholder = "Listening...";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                inputField.value = transcript;
                sendMessage(); // Auto-send when you stop talking
            };

            recognition.onerror = function(event) {
                console.error("Speech error", event.error);
                resetMic();
                if(event.error === 'not-allowed') {
                    alert("Please allow microphone access in your browser settings.");
                }
            };

            recognition.onend = function() {
                resetMic();
            };
        } else {
            micBtn.style.display = "none";
            console.log("Speech Recognition not supported in this browser.");
        }

        function toggleVoice() {
            unlockAudio(); // Unlock speakers
            if (isListening) {
                recognition.stop();
            } else {
                try {
                    recognition.start();
                } catch(e) {
                    console.error("Mic start error", e);
                    resetMic();
                }
            }
        }

        function resetMic() {
            isListening = false;
            micBtn.classList.remove("listening");
            inputField.placeholder = "Ask Nguru...";
        }

        // 3. Text to Speech (Nguru Talks Back)
        function speakText(text) {
            let cleanText = text.replace("▶ PLAY VIDEO", "").trim();
            if (!cleanText) return;

            // Stop any currently playing speech so it doesn't overlap
            window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 1.0; 
            
            window.speechSynthesis.speak(utterance);
        }

        async function sendMessage() {
            unlockAudio(); // Unlock speakers on text send too
            const message = inputField.value;
            if (!message) return;

            addMessageToUI(message, "user");
            inputField.value = "";
            addMessageToUI("Nguru is thinking...", "ai", "loading");

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: userId, userMessage: message })
                });

                const data = await response.json();
                document.getElementById("loading").remove(); 

                if (data.inject_video) {
                    addMessageToUI(`▶ PLAY VIDEO\n\n${data.ai_response_text}`, "ai", null, false, true);
                } else {
                    addMessageToUI(data.ai_response_text, "ai", null, data.is_testing);
                }

                // Make Nguru read the response out loud!
                speakText(data.ai_response_text);

                if (data.deferred_topic) {
                    showBanner(`Topic too deep. Saved '${data.deferred_topic}' for later.`);
                }
            } catch (error) {
                document.getElementById("loading").remove();
                addMessageToUI("Connection lost. Please try again.", "ai");
            }
        }

        function addMessageToUI(text, sender, id = null, isTesting = false, isVideo = false) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `message ${sender}-message`;
            if (isTesting) div.classList.add("ai-testing");
            if (isVideo) { div.style.backgroundColor = "#000"; div.style.color = "#FFF"; }
            if (id) div.id = id;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showBanner(text) {
            const banner = document.getElementById("deferredBanner");
            banner.innerText = text;
            banner.style.display = "block";
            setTimeout(() => banner.style.display = "none", 5000);
        }
    </script>
</body>
</html>
