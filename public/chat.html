<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nguru AI</title>
    <style>
        /* PREMIUM DARK MODE UI */
        :root { --bg-main: #212121; --bg-sidebar: #171717; --bg-input: #2F2F2F; --text-main: #ECECEC; --text-muted: #9E9E9E; --brand: #6200EE; --brand-hover: #7E3FF2; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 280px; background: var(--bg-sidebar); display: flex; flex-direction: column; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); position: absolute; height: 100%; z-index: 1000; transform: translateX(-100%); border-right: 1px solid #333; }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header { padding: 20px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #333; }
        .new-chat-btn { background: var(--brand); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; flex-grow: 1; font-weight: 600; font-size: 15px; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .new-chat-btn:hover { background: var(--brand-hover); }
        .close-sidebar { background: transparent; border: none; color: var(--text-muted); font-size: 28px; cursor: pointer; padding: 0 5px; }
        
        /* SIDEBAR HISTORY ITEMS WITH RENAME/DELETE */
        .history-list { flex: 1; overflow-y: auto; padding: 15px 10px; display: flex; flex-direction: column; gap: 8px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: transparent; border-radius: 8px; cursor: pointer; transition: background 0.2s; }
        .history-item:hover, .history-item.active { background: #2A2A2A; }
        .session-title { flex: 1; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .session-actions { display: none; gap: 5px; }
        .history-item:hover .session-actions, .history-item.active .session-actions { display: flex; }
        .action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 14px; cursor: pointer; padding: 4px; border-radius: 4px; }
        .action-btn:hover { background: #444; color: white; }

        /* MAIN CHAT AREA */
        .main-area { flex: 1; display: flex; flex-direction: column; width: 100%; position: relative; }
        .header { background: rgba(33, 33, 33, 0.8); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid #333; position: absolute; top: 0; width: 100%; z-index: 10; box-sizing: border-box; }
        .menu-btn { background: transparent; border: none; color: var(--text-main); font-size: 24px; cursor: pointer; margin-right: 15px; }
        .header-title { font-weight: 600; font-size: 18px; letter-spacing: 0.5px; }
        
        .chat-container { flex: 1; padding: 80px 20px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        
        /* SLEEK MESSAGE BUBBLES */
        .message { max-width: 85%; padding: 14px 18px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.1); animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .message.user { align-self: flex-end; background: var(--brand); color: white; border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-start; background: #2A2A2A; color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid #333; }
        .message.loading { font-style: italic; color: var(--text-muted); background: transparent; box-shadow: none; border: none; padding: 0; animation: pulse 1.5s infinite; }
        
        /* INPUT AREA */
        .input-area { padding: 15px 20px; background: var(--bg-main); border-top: 1px solid #333; display: flex; align-items: center; gap: 10px; }
        .input-wrapper { flex: 1; display: flex; align-items: center; background: var(--bg-input); border-radius: 24px; padding: 5px 15px; border: 1px solid #444; }
        input[type="text"] { flex: 1; padding: 12px 0; border: none; background: transparent; color: white; font-size: 15px; outline: none; }
        input[type="text"]::placeholder { color: var(--text-muted); }
        
        #micBtn { background: transparent; color: var(--text-muted); border: none; font-size: 20px; cursor: pointer; padding: 8px; border-radius: 50%; transition: all 0.3s; }
        #micBtn.recording { color: #FF3B30; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        .sendBtn { background: var(--brand); color: white; border: none; border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s, background 0.2s; box-shadow: 0 2px 8px rgba(98, 0, 238, 0.4); }
        .sendBtn:active { transform: scale(0.95); }
        .sendBtn svg { fill: white; width: 20px; height: 20px; margin-left: 2px; }

        .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 999; backdrop-filter: blur(2px); }
        .overlay.show { display: block; }
        
        .video-container { margin-top: 15px; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>
            <button class="close-sidebar" onclick="toggleSidebar()">×</button>
        </div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="main-area">
        <div class="header">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <span class="header-title">Nguru</span>
        </div>
        
        <div class="chat-container" id="chat-box"></div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" placeholder="Ask Nguru anything..." onkeypress="handleKeyPress(event)">
                <button id="micBtn" onclick="toggleVoice()" title="Tap to Speak">🎤</button>
            </div>
            <button class="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem("nguru_userId");
        if (!userId) window.location.href = "/";

        let currentSessionId = null;

        // --- UI & SIDEBAR LOGIC ---
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function startNewChat() {
            currentSessionId = null;
            document.getElementById('chat-box').innerHTML = '';
            appendMessage('ai', "Authentication verified. I'm ready. What are we analyzing today?", null, false);
            toggleSidebar(); 
            loadSessions(); 
        }

        async function loadSessions() {
            try {
                const response = await fetch(`/api/chat/sessions/${userId}`);
                if (response.ok) {
                    const sessions = await response.json();
                    const listDiv = document.getElementById('history-list');
                    listDiv.innerHTML = '';
                    
                    sessions.forEach(session => {
                        const btnDiv = document.createElement('div');
                        btnDiv.className = `history-item ${session.id === currentSessionId ? 'active' : ''}`;
                        
                        btnDiv.innerHTML = `
                            <div class="session-title" onclick="loadChatHistory(${session.id})">${session.title || 'New Chat'}</div>
                            <div class="session-actions">
                                <button class="action-btn" onclick="renameSession(${session.id}, '${session.title}', event)" title="Rename">✏️</button>
                                <button class="action-btn" onclick="deleteSession(${session.id}, event)" title="Delete">🗑️</button>
                            </div>
                        `;
                        listDiv.appendChild(btnDiv);
                    });
                }
            } catch (error) { console.error("Failed to load sessions"); }
        }

        // --- RENAME & DELETE LOGIC ---
        async function renameSession(sessionId, oldTitle, event) {
            event.stopPropagation(); // Stop folder from opening when clicking edit
            const newTitle = prompt("Rename chat:", oldTitle);
            if (!newTitle || newTitle.trim() === "" || newTitle === oldTitle) return;

            try {
                await fetch(`/api/chat/sessions/${sessionId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: newTitle.trim() })
                });
                loadSessions();
            } catch (err) { console.error("Rename failed"); }
        }

        async function deleteSession(sessionId, event) {
            event.stopPropagation();
            if (!confirm("Delete this chat permanently?")) return;

            try {
                await fetch(`/api/chat/sessions/${sessionId}`, { method: 'DELETE' });
                if (currentSessionId === sessionId) {
                    startNewChat(); // Reset screen if they delete the active chat
                } else {
                    loadSessions();
                }
            } catch (err) { console.error("Delete failed"); }
        }

        // --- CHAT LOGIC ---
        async function loadChatHistory(sessionId) {
            currentSessionId = sessionId;
            document.getElementById('chat-box').innerHTML = '';
            toggleSidebar(); 
            loadSessions(); 

            try {
                const response = await fetch(`/api/chat/history/${sessionId}`);
                if (response.ok) {
                    const history = await response.json();
                    if (history.length > 0) {
                        history.forEach(msg => appendMessage(msg.role, msg.message, null, false));
                    } else {
                        appendMessage('ai', "Memory banks empty for this session.", null, false);
                    }
                }
            } catch (error) { console.error("History failed"); }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const cleanText = text.replace(/<[^>]+>/g, '').replace(/\\*/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                window.speechSynthesis.speak(utterance);
            }
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let isRecording = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.onresult = (event) => {
                document.getElementById('userInput').value = event.results[0][0].transcript;
                sendMessage(); 
            };
            recognition.onend = () => {
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
            };
        } else {
            document.getElementById('micBtn').style.display = 'none';
        }

        function toggleVoice() {
            if (!recognition) return;
            if (isRecording) { recognition.stop(); } 
            else { recognition.start(); isRecording = true; document.getElementById('micBtn').classList.add('recording'); }
        }

        function handleKeyPress(event) { if (event.key === 'Enter') sendMessage(); }

        function appendMessage(role, text, videoId = null, playAudio = true) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            let innerContent = `<div>${text.replace(/\\n/g, '<br>')}</div>`;

            if (role === 'ai' && videoId) {
                innerContent += `
                <div class="video-container">
                    <iframe width="100%" height="215" src="https://www.youtube.com/embed/${videoId}?autoplay=0" frameborder="0" allowfullscreen></iframe>
                </div>`;
            }

            msgDiv.innerHTML = innerContent;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (role === 'ai' && playAudio) speakText(text);
        }

        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage('user', text, null, false);
            inputField.value = '';
            
            const chatBox = document.getElementById('chat-box');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message loading';
            loadingDiv.innerText = 'Nguru is processing...';
            loadingDiv.id = 'loading-msg';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, sessionId: currentSessionId, message: text })
                });
                
                document.getElementById('loading-msg').remove();
                const data = await response.json();
                
                if (response.ok) {
                    appendMessage('ai', data.ai_response_text, data.video_id, true);
                    if (!currentSessionId && data.session_id) {
                        currentSessionId = data.session_id;
                        loadSessions();
                    }
                } else {
                    appendMessage('ai', 'Error: Signal lost.', null, false);
                }
            } catch (error) {
                document.getElementById('loading-msg')?.remove();
                appendMessage('ai', 'System offline.', null, false);
            }
        }
        
        loadSessions(); 
        startNewChat(); 
    </script>
</body>
</html>
