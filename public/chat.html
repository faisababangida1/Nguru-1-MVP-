<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguru AI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #FAFAFA; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #6200EE; color: white; padding: 20px; text-align: center; font-size: 20px; font-weight: bold; position: relative; }
        .banner { background-color: #FF9800; color: white; text-align: center; padding: 10px; font-size: 14px; display: none; font-weight: bold; }
        
        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        .message { max-width: 80%; padding: 15px; border-radius: 12px; font-size: 16px; line-height: 1.4; }
        .user-message { background-color: #E0E0E0; color: #333; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background-color: #FFFFFF; color: #333; border: 1px solid #DDD; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        /* The Weak Point Interrogator UI */
        .ai-testing { border: 2px solid #D32F2F; border-top: 20px solid #D32F2F; position: relative; }
        .ai-testing::before { content: "POP QUIZ"; position: absolute; top: -18px; left: 5px; color: white; font-size: 12px; font-weight: bold; }
        
        /* The Media Pivot UI */
        .video-card { background-color: #000; color: #FFF; padding: 40px 20px; text-align: center; border-radius: 12px; font-weight: bold; }

        .input-area { padding: 15px; background-color: #FFF; border-top: 1px solid #DDD; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 15px; border: 1px solid #DDD; border-radius: 25px; font-size: 16px; }
        button { background-color: #6200EE; color: white; border: none; padding: 15px 20px; border-radius: 25px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">Nguru Mentorship</div>
    <div id="deferredBanner" class="banner"></div>

    <div class="chat-container" id="chatBox">
        <div class="message ai-message">Welcome. What are we learning today?</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask Nguru...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        // 1. Get the secure userId we saved during login
        const userId = localStorage.getItem("nguru_userId");
        if (!userId) {
            window.location.href = "/index.html"; // Kick them out if not logged in
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const message = inputField.value;
            if (!message) return;

            addMessageToUI(message, "user");
            inputField.value = "";
            addMessageToUI("Nguru is thinking...", "ai", "loading");

            try {
                // 2. Fire the message to your Render Backend
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId: userId, userMessage: message })
                });

                const data = await response.json();
                document.getElementById("loading").remove(); // Remove 'thinking' text

                // 3. Handle the Anti-Frustration Media Pivot
                if (data.inject_video) {
                    addVideoCardToUI(data.ai_response_text);
                } else {
                    // 4. Handle Standard or Interrogation text
                    addMessageToUI(data.ai_response_text, "ai", null, data.is_testing);
                }

                // 5. Handle the "Very Deep" Deflection
                if (data.deferred_topic) {
                    showBanner(`Topic too deep. Saved '${data.deferred_topic}' for later.`);
                }

            } catch (error) {
                document.getElementById("loading").remove();
                addMessageToUI("Connection lost. Please try again.", "ai");
            }
        }

        function addMessageToUI(text, sender, id = null, isTesting = false) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = `message ${sender}-message`;
            if (isTesting) div.classList.add("ai-testing");
            if (id) div.id = id;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addVideoCardToUI(text) {
            const chatBox = document.getElementById("chatBox");
            const div = document.createElement("div");
            div.className = "message ai-message video-card";
            div.innerText = `▶ PLAY VIDEO\n\n${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showBanner(text) {
            const banner = document.getElementById("deferredBanner");
            banner.innerText = text;
            banner.style.display = "block";
            setTimeout(() => banner.style.display = "none", 5000);
        }
    </script>
</body>
</html>
