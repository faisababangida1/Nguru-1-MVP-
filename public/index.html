<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nguru | Enter the Engine</title>
    <style>
        :root { --bg-main: #121212; --bg-card: #1E1E1E; --text-main: #FFFFFF; --text-muted: #A0A0A0; --brand: #6200EE; --brand-hover: #7E3FF2; --input-bg: #2C2C2C; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background-color: var(--bg-main); color: var(--text-main); display: flex; align-items: center; justify-content: center; height: 100vh; }
        
        .container { background: var(--bg-card); padding: 35px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; text-align: center; }
        .logo { font-size: 28px; font-weight: 800; margin-bottom: 5px; }
        .logo span { color: var(--brand); }
        .tagline { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }

        .toggle-box { display: flex; background: var(--input-bg); border-radius: 8px; margin-bottom: 20px; padding: 4px; }
        .toggle-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 6px; }
        .toggle-btn.active { background: var(--bg-card); color: var(--text-main); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid #3E3E3E; border-radius: 8px; color: white; font-size: 15px; outline: none; }
        .form-group input:focus { border-color: var(--brand); }

        .action-btn { width: 100%; padding: 14px; background: var(--brand); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .action-btn:hover { background: var(--brand-hover); }
        .text-link { color: var(--brand); font-size: 13px; cursor: pointer; background: none; border: none; margin-top: 15px; display: inline-block; }

        #error-msg, #success-msg { font-size: 13px; margin-top: 15px; display: none; }
        #error-msg { color: #FF3B30; }
        #success-msg { color: #34C759; }
        
        #wizard-section, #forgot-section { display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Ngu<span>ru</span></div>
        <div class="tagline">The Relational Mastery Engine</div>

        <div id="auth-section">
            <div class="toggle-box">
                <button class="toggle-btn active" id="btn-login" onclick="switchTab('login')">Log In</button>
                <button class="toggle-btn" id="btn-register" onclick="switchTab('register')">Sign Up</button>
            </div>

            <div class="form-group hidden" id="name-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Faisal Babangida">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button class="action-btn" id="submit-btn" onclick="handleAuth()">Enter Engine</button>
            <button class="text-link" id="forgot-link" onclick="showForgot()">Forgot Password?</button>
            <div id="error-msg"></div>
        </div>

        <div id="forgot-section">
            <h3 style="margin-bottom: 10px;">Reset Password</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Enter your email to receive a temporary password.</p>
            <div class="form-group">
                <input type="email" id="forgot-email" placeholder="you@example.com">
            </div>
            <button class="action-btn" onclick="handleReset()">Reset Password</button>
            <button class="text-link" onclick="hideForgot()">Back to Login</button>
            <div id="success-msg"></div>
        </div>

        <div id="wizard-section">
            <h3 style="margin-bottom: 10px;">Customize Your Brain</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">What analogies help you learn best?</p>
            <div class="form-group">
                <label>Interest 1 (Required)</label>
                <input type="text" id="interest-1" placeholder="e.g. Football">
            </div>
            <div class="form-group">
                <label>Interest 2 (Optional)</label>
                <input type="text" id="interest-2" placeholder="e.g. Coding">
            </div>
            <button class="action-btn" id="wizard-btn" onclick="finishWizard()">Start Mentorship</button>
        </div>
    </div>

    <script>
        let isLogin = true;
        if (localStorage.getItem("nguru_userId")) window.location.href = "/chat.html";

        function switchTab(tab) {
            isLogin = (tab === 'login');
            document.getElementById('btn-login').className = isLogin ? 'toggle-btn active' : 'toggle-btn';
            document.getElementById('btn-register').className = !isLogin ? 'toggle-btn active' : 'toggle-btn';
            document.getElementById('name-group').className = isLogin ? 'form-group hidden' : 'form-group';
            document.getElementById('submit-btn').innerText = isLogin ? 'Enter Engine' : 'Create Account';
            document.getElementById('forgot-link').style.display = isLogin ? 'inline-block' : 'none';
            document.getElementById('error-msg').style.display = 'none';
        }

        function showForgot() {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('forgot-section').style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
            document.getElementById('success-msg').style.display = 'none';
        }

        function hideForgot() {
            document.getElementById('forgot-section').style.display = 'none';
            document.getElementById('auth-section').style.display = 'block';
        }

        function showMessage(msg, isError = true) {
            const el = document.getElementById(isError ? 'error-msg' : 'success-msg');
            el.innerText = msg;
            el.style.display = 'block';
        }

        async function handleAuth() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('submit-btn');

            if (!email || !password || (!isLogin && !name)) {
                return showMessage("Please fill in all required fields.");
            }

            btn.innerText = "Processing..."; btn.disabled = true;
            const endpoint = isLogin ? '/api/auth/login' : '/api/auth/register';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem("nguru_userId", data.user.id);
                    if (!isLogin) {
                        document.getElementById('auth-section').style.display = 'none';
                        document.getElementById('wizard-section').style.display = 'block';
                    } else window.location.href = "/chat.html";
                } else showMessage(data.error);
            } catch (err) { showMessage("Server disconnected."); }
            btn.innerText = isLogin ? 'Enter Engine' : 'Create Account'; btn.disabled = false;
        }

        async function handleReset() {
            const email = document.getElementById('forgot-email').value.trim();
            if (!email) return showMessage("Enter your email.", true);
            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                if (res.ok) showMessage(data.message, false);
                else showMessage(data.error, true);
            } catch (err) { showMessage("Error connecting to server.", true); }
        }

        async function finishWizard() {
            const int1 = document.getElementById('interest-1').value.trim();
            const int2 = document.getElementById('interest-2').value.trim();
            if (!int1) return alert("Please enter at least one interest.");
            const interests = int2 ? [int1, int2] : [int1];
            
            try {
                await fetch('/api/user/interests', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: localStorage.getItem("nguru_userId"), interests })
                });
            } catch (e) {}
            window.location.href = "/chat.html";
        }
    </script>
</body>
</html>
