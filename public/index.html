<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nguru AI Mentorship</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 24px; background-color: #FAFAFA; margin: 0; }
        .container { max-width: 400px; margin: 0 auto; margin-top: 40px; }
        h1 { color: #333; margin-bottom: 5px; }
        p.subtitle { color: #666; margin-bottom: 30px; }
        
        /* Tab Styles */
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #888; }
        .tab.active { color: #6200EE; border-bottom: 3px solid #6200EE; }
        
        input { width: 100%; padding: 15px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; background-color: #EEEEEE; font-size: 16px; }
        
        #signup-section { display: none; } /* Hidden by default */
        .analogies-title { font-weight: bold; margin-bottom: 10px; color: #333; }
        .analogies-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        
        button.action-btn { width: 100%; padding: 18px; background-color: #6200EE; color: white; border: none; font-size: 18px; font-weight: bold; border-radius: 8px; }
        #statusMessage { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Nguru</h1>
        <p class="subtitle">Access your mentorship engine.</p>

        <div class="tabs">
            <div class="tab active" id="tab-login" onclick="switchMode('login')">Log In</div>
            <div class="tab" id="tab-signup" onclick="switchMode('signup')">Sign Up</div>
        </div>

        <input type="email" id="emailInput" placeholder="Email Address">
        <input type="password" id="passwordInput" placeholder="Password">

        <div id="signup-section">
            <div class="analogies-title">What makes sense to you?</div>
            <div class="analogies-grid">
                <label><input type="checkbox" class="analogy-check" value="Football"> Football</label>
                <label><input type="checkbox" class="analogy-check" value="Street Business"> Street Business</label>
                <label><input type="checkbox" class="analogy-check" value="Crypto"> Crypto</label>
                <label><input type="checkbox" class="analogy-check" value="Music Production"> Music Production</label>
            </div>
        </div>

        <button class="action-btn" id="mainActionBtn" onclick="processAuth()">Log In</button>
        <p id="statusMessage"></p>
    </div>

    <script>
        let currentMode = 'login';

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('statusMessage').innerText = "";
            
            if (mode === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('tab-signup').classList.remove('active');
                document.getElementById('signup-section').style.display = 'none';
                document.getElementById('mainActionBtn').innerText = "Log In";
            } else {
                document.getElementById('tab-signup').classList.add('active');
                document.getElementById('tab-login').classList.remove('active');
                document.getElementById('signup-section').style.display = 'block';
                document.getElementById('mainActionBtn').innerText = "Create Mind Object";
            }
        }

        async function processAuth() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const statusText = document.getElementById('statusMessage');

            if (!email || !password) {
                statusText.style.color = "red";
                statusText.innerText = "Please enter an email and password.";
                return;
            }

            statusText.style.color = "#666";
            statusText.innerText = currentMode === 'login' ? "Authenticating..." : "Building Mind Object...";

            // Determine if we are logging in or registering based on the tab
            const endpoint = currentMode === 'login' ? "/api/auth/login" : "/api/auth/register";
            
            // Collect analogies only if signing up
            let payload = { email: email, password: password };
            
            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    statusText.style.color = "green";
                    statusText.innerText = "Success! Entering Nguru...";
                    localStorage.setItem("nguru_userId", data.userId);
                    
                    // Small delay so you can read the success message
                    setTimeout(() => {
                        window.location.href = "/chat.html";
                    }, 1000);
                } else {
                    statusText.style.color = "red";
                    statusText.innerText = "Error: " + (data.error || "Could not connect.");
                }
            } catch (error) {
                statusText.style.color = "red";
                statusText.innerText = "Server offline or connection failed.";
            }
        }
    </script>
</body>
</html>
